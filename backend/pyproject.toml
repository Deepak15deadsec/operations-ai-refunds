[project]
name = "operations-backend"
version = "0.1.0"
description = "Operations AI backend: FastAPI API, LangGraph workflow, worker and domain services"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
    "langchain[mcp]>=1.4.7",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.2.18",
    "langgraph-checkpoint-postgres>=3.2.0",
    "mcp>=2.3,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
