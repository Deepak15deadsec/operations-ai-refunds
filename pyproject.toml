[project]
name = "ai-operations-agent"
version = "0.1.0"
description = "Operations AI: workspace root (backend + MCP operations server)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "mcp_servers/operations"]

[tool.uv.sources]
operations-backend = { workspace = true }
operations-mcp = { workspace = true }

[dependency-groups]
dev = [
    "operations-backend",
    "operations-mcp",
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S105", "S106", "S311", "B008", "UP040"]

[tool.ruff.lint.isort]
known-first-party = ["app", "operations_mcp", "tests", "scripts"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "B"]
"evaluations/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "mcp_servers/operations/tests"]
pythonpath = ["backend", "mcp_servers/operations"]
timeout = 120
addopts = "-ra"
markers = [
    "live_llm: requires a real LLM provider key (skipped by default)",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
